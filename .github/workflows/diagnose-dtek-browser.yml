name: Diagnose DTEK browser
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: automation/package-lock.json
      - run: npm ci
        working-directory: automation
      - name: Probe DTEK in Chromium with a shared browser session
        run: |
          node --input-type=module <<'JS'
          import { fetchDtekBrowser } from './automation/scripts/dtek-browser-fallback.mjs';
          const report = await fetchDtekBrowser();
          console.log(JSON.stringify(report, null, 2));
          if (report.steps.some(step => !step.ok)) process.exitCode = 1;
          JS
