name: Update DTEK Outages Schedule

on:
  schedule:
    - cron: '*/6 * * * *'  # Every 6 minutes
  workflow_dispatch:  # Allow manual trigger

jobs:
  update-dtek-schedule:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Test DTEK processor
        run: node --test process-dtek-data.test.js

      - name: Fetch DTEK data
        run: |
          curl --fail --location --silent --show-error \
            --retry 3 --retry-all-errors --retry-delay 5 \
            --connect-timeout 15 --max-time 60 \
            "https://www.dtek-dnem.com.ua/ua/shutdowns" \
            --output raw-dtek-data.html

      - name: Process DTEK data
        run: |
          node process-dtek-data.js

      - name: Commit and push if changed
        id: commit
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/dtek-outages.json
          if git diff --quiet && git diff --staged --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            git commit -m "Update DTEK outages schedule [skip ci]"
            git push
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      
