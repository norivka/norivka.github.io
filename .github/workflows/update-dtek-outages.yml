name: Update DTEK Outages Schedule

on:
  schedule:
    - cron: '15 * * * *'  # Every hour
  workflow_dispatch:  # Allow manual trigger

jobs:
  update-dtek-schedule:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Test DTEK processor
        run: node --test process-dtek-data.test.js fetch-dtek-data.test.js

      - name: Fetch and process DTEK data
        id: fetch
        run: bash fetch-dtek-data.sh

      - name: Save failed DTEK response
        if: failure() && steps.fetch.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: failed-dtek-response
          path: raw-dtek-data.html
          if-no-files-found: ignore
          retention-days: 3

      - name: Commit and push if changed
        id: commit
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/dtek-outages.json
          if git diff --quiet && git diff --staged --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            git commit -m "Update DTEK outages schedule [skip ci]"
            git push
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      
